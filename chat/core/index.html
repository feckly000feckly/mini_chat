<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Чат · клиент</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #f6f1ff;
    --panel: #fffdff;
    --panel-2: #f4edff;
    --line: #e4d7fb;
    --text: #2c1b45;
    --muted: #9683b8;
    --accent: #b026ff;
    --accent-soft: #e9d5ff;
    --accent-dim: #ecdcff;
    --danger: #e2437a;
    --bubble-other: #efe4ff;
    --radius: 16px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family:'IBM Plex Sans', system-ui, sans-serif;
    display:flex;
    height:100vh;
    overflow:hidden;
    position: relative;
  }
  .bg-wash{
    position: fixed;
    inset: -35%;
    z-index: 0;
    pointer-events: none;
    background: conic-gradient(from 0deg at 50% 50%,
      #d8a6ff, #ffc2ef, #b48bff, #e6b8ff, #ffb0e8, #c9a6ff, #d8a6ff);
    filter: blur(95px) saturate(170%);
    opacity: 0.85;
    animation: washSpin 22s linear infinite;
    will-change: transform;
  }
  @keyframes washSpin{
    to{ transform: rotate(360deg); }
  }
  @media (prefers-reduced-motion: reduce){
    .bg-wash{ animation: none !important; }
  }
  .blob{
    position: fixed;
    border-radius: 50%;
    filter: blur(70px);
    z-index: 0;
    pointer-events: none;
    will-change: transform, border-radius;
  }
  .blob1{ width:560px; height:560px; top:-160px; left:-120px;
    background: radial-gradient(circle, #d8a6ff 0%, transparent 70%);
    animation: drift1 5s ease-in-out infinite alternate; }
  .blob2{ width:500px; height:500px; bottom:-140px; right:-100px;
    background: radial-gradient(circle, #ffb0e8 0%, transparent 70%);
    animation: drift2 5.8s ease-in-out infinite alternate; }
  .blob3{ width:420px; height:420px; top:40%; left:38%;
    background: radial-gradient(circle, #b48bff 0%, transparent 70%);
    opacity: 0.65;
    animation: drift3 4.2s ease-in-out infinite alternate; }
  .blob4{ width:380px; height:380px; top:8%; right:12%;
    background: radial-gradient(circle, #ffd8f6 0%, transparent 70%);
    opacity: 0.6;
    animation: drift4 5.3s ease-in-out infinite alternate; }
  .blob5{ width:420px; height:420px; bottom:6%; left:6%;
    background: radial-gradient(circle, #c9a6ff 0%, transparent 70%);
    opacity: 0.6;
    animation: drift5 4.8s ease-in-out infinite alternate; }
  .blob6{ width:340px; height:340px; top:55%; right:-4%;
    background: radial-gradient(circle, #ffb8e0 0%, transparent 70%);
    opacity: 0.55;
    animation: drift6 6.2s ease-in-out infinite alternate; }

  @keyframes drift1{
    0%   { transform: translate(0,0) scale(1) rotate(0deg);    border-radius: 50%; }
    35%  { transform: translate(140px,90px) scale(1.25) rotate(25deg); border-radius: 42% 58% 60% 40% / 45% 40% 60% 55%; }
    70%  { transform: translate(60px,180px) scale(0.85) rotate(-15deg); border-radius: 58% 42% 40% 60% / 55% 60% 40% 45%; }
    100% { transform: translate(190px,30px) scale(1.15) rotate(18deg); border-radius: 46% 54% 55% 45% / 50% 46% 54% 50%; }
  }
  @keyframes drift2{
    0%   { transform: translate(0,0) scale(1) rotate(0deg);    border-radius: 50%; }
    40%  { transform: translate(-150px,-70px) scale(1.3) rotate(-20deg); border-radius: 60% 40% 45% 55% / 40% 55% 45% 60%; }
    75%  { transform: translate(-70px,-170px) scale(0.8) rotate(12deg); border-radius: 40% 60% 55% 45% / 60% 45% 55% 40%; }
    100% { transform: translate(-190px,-30px) scale(1.2) rotate(-16deg); border-radius: 52% 48% 46% 54% / 48% 52% 48% 52%; }
  }
  @keyframes drift3{
    0%   { transform: translate(0,0) scale(1);    border-radius: 50%; }
    50%  { transform: translate(-110px,110px) scale(1.35); border-radius: 45% 55% 65% 35% / 55% 45% 55% 45%; }
    100% { transform: translate(90px,-90px) scale(0.82); border-radius: 55% 45% 40% 60% / 45% 55% 45% 55%; }
  }
  @keyframes drift4{
    0%   { transform: translate(0,0) scale(1) rotate(0deg);   border-radius: 50%; }
    45%  { transform: translate(-90px,130px) scale(0.8) rotate(-18deg); border-radius: 55% 45% 50% 50% / 40% 50% 50% 60%; }
    100% { transform: translate(-160px,40px) scale(1.25) rotate(14deg); border-radius: 48% 52% 55% 45% / 52% 48% 52% 48%; }
  }
  @keyframes drift5{
    0%   { transform: translate(0,0) scale(1) rotate(0deg);   border-radius: 50%; }
    50%  { transform: translate(120px,-80px) scale(1.3) rotate(20deg); border-radius: 40% 60% 55% 45% / 60% 40% 55% 45%; }
    100% { transform: translate(60px,-140px) scale(0.85) rotate(-12deg); border-radius: 55% 45% 45% 55% / 45% 55% 45% 55%; }
  }
  @keyframes drift6{
    0%   { transform: translate(0,0) scale(1) rotate(0deg);   border-radius: 50%; }
    50%  { transform: translate(-130px,-60px) scale(1.2) rotate(-16deg); border-radius: 45% 55% 60% 40% / 55% 45% 60% 40%; }
    100% { transform: translate(-70px,80px) scale(0.9) rotate(10deg); border-radius: 52% 48% 48% 52% / 48% 52% 48% 52%; }
  }

  @media (prefers-reduced-motion: reduce){
    .blob{ animation: none !important; }
  }

  /* ---------- Sidebar ---------- */
  aside{
    width: 280px;
    min-width: 280px;
    background: rgba(255,255,255,0.45);
    backdrop-filter: blur(28px) saturate(180%);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
    border-right: 1px solid rgba(255,255,255,0.7);
    box-shadow: 1px 0 24px rgba(120, 60, 200, 0.06);
    display:flex;
    flex-direction:column;
    padding: 22px 20px;
    position: relative;
    z-index: 1;
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:9px;
    margin-bottom: 26px;
  }
  .brand .dot{
    width:9px;height:9px;border-radius:50%;
    background: var(--accent);
    box-shadow: 0 0 10px 1px color-mix(in srgb, var(--accent) 60%, transparent);
    flex-shrink:0;
  }
  .brand h1{
    font-size: 16px;
    font-weight:600;
    margin:0;
    letter-spacing: 0.01em;
    background: linear-gradient(100deg, #7c1fd4, var(--accent) 60%, #ff5fc4);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .field{
    margin-bottom: 16px;
  }
  .field label{
    display:block;
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .field input{
    width:100%;
    background: rgba(255,255,255,0.55);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.8);
    box-shadow: inset 0 1px 2px rgba(120,60,200,0.05);
    border-radius: 10px;
    color: var(--text);
    font-family:'IBM Plex Mono', monospace;
    font-size: 13px;
    padding: 9px 10px;
    outline:none;
    transition: border-color .15s, box-shadow .15s;
  }
  .field input:focus{
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);
  }

  .status{
    margin-top: auto;
    padding-top: 18px;
    border-top: 1px solid var(--line);
    font-family:'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    display:flex;
    flex-direction:column;
    gap: 8px;
  }
  .status-row{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .status-led{
    width:7px;height:7px;border-radius:50%;
    background: var(--muted);
    flex-shrink:0;
    transition: background .2s;
  }
  .status-led.ok{ background: var(--accent); box-shadow: 0 0 8px var(--accent); animation: pulseLed 2s ease-in-out infinite;}
  @keyframes pulseLed{
    0%,100%{ box-shadow: 0 0 6px var(--accent); }
    50%{ box-shadow: 0 0 12px 2px var(--accent); }
  }
  .status-led.bad{ background: var(--danger); }
  .refresh-btn{
    margin-top: 4px;
    background: rgba(255,255,255,0.5);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.8);
    color: var(--muted);
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    padding: 8px 10px;
    border-radius: 9px;
    cursor:pointer;
    transition: all .15s;
    text-align:left;
  }
  .refresh-btn:hover{ border-color: var(--accent); color: var(--accent); }

  /* ---------- Main ---------- */
  main{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width:0;
    position: relative;
    z-index: 1;
  }
  header{
    padding: 18px 28px;
    background: rgba(255,255,255,0.35);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border-bottom: 1px solid rgba(255,255,255,0.6);
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  header h2{
    font-size: 15px;
    font-weight: 500;
    margin:0;
    color: var(--text);
  }
  header span{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--muted);
  }

  .menu-btn{
    display: none;
    flex-direction: column;
    justify-content: center;
    gap: 4px;
    width: 34px;
    height: 34px;
    padding: 0;
    background: rgba(255,255,255,0.5);
    border: 1px solid rgba(255,255,255,0.8);
    border-radius: 9px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .menu-btn span{
    display:block;
    height: 2px;
    margin: 0 7px;
    border-radius: 2px;
    background: var(--text);
    transition: transform .2s ease, opacity .2s ease;
  }
  .menu-btn.open span:nth-child(1){ transform: translateY(6px) rotate(45deg); }
  .menu-btn.open span:nth-child(2){ opacity: 0; }
  .menu-btn.open span:nth-child(3){ transform: translateY(-6px) rotate(-45deg); }

  .overlay{ display: none; }

  #log{
    flex:1;
    overflow-y:auto;
    padding: 24px 28px;
    display:flex;
    flex-direction:column;
    gap: 4px;
  }
  #log::-webkit-scrollbar{ width:8px; }
  #log::-webkit-scrollbar-thumb{ background: var(--accent-dim); border-radius: 4px; }

  .empty{
    margin:auto;
    text-align:center;
    color: var(--muted);
    font-size: 13px;
    max-width: 320px;
    line-height:1.6;
  }
  .empty .big{
    font-family:'IBM Plex Mono', monospace;
    font-size: 28px;
    color: var(--accent-dim);
    margin-bottom: 10px;
  }

  .row{
    display:flex;
    margin: 6px 0;
    max-width: 100%;
  }
  .row.mine{ justify-content:flex-end; }
  .row.theirs{ justify-content:flex-start; }

  .bubble-wrap{
    max-width: 62%;
    display:flex;
    flex-direction:column;
    gap:3px;
  }
  .row.mine .bubble-wrap{ align-items:flex-end; }
  .row.theirs .bubble-wrap{ align-items:flex-start; }

  .meta{
    font-family:'IBM Plex Mono', monospace;
    font-size: 10.5px;
    color: var(--muted);
    padding: 0 4px;
  }

  .bubble{
    padding: 10px 14px;
    border-radius: var(--radius);
    font-size: 14px;
    line-height: 1.45;
    word-wrap: break-word;
    white-space: pre-wrap;
    position: relative;
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .row.mine .bubble:hover{ transform: translateY(-1px) scale(1.015); }
  .row.theirs .bubble:hover{ transform: translateY(-1px); }
  .row.theirs .bubble{
    background: rgba(255,255,255,0.55);
    backdrop-filter: blur(14px) saturate(160%);
    -webkit-backdrop-filter: blur(14px) saturate(160%);
    border: 1px solid rgba(255,255,255,0.7);
    border-bottom-left-radius: 4px;
    color: var(--text);
  }
  .row.mine .bubble{
    background: linear-gradient(135deg, rgba(201,75,255,0.9), color-mix(in srgb, var(--accent) 88%, transparent) 55%, rgba(138,31,224,0.92));
    backdrop-filter: blur(14px) saturate(160%);
    -webkit-backdrop-filter: blur(14px) saturate(160%);
    border: 1px solid rgba(255,255,255,0.35);
    box-shadow: 0 4px 18px -4px color-mix(in srgb, var(--accent) 55%, transparent);
    color: #fff;
    border-bottom-right-radius: 4px;
    font-weight: 500;
  }

  .del-btn{
    background:none;
    border:none;
    color: var(--muted);
    font-family:'IBM Plex Mono', monospace;
    font-size: 10.5px;
    cursor:pointer;
    padding: 2px 4px;
    opacity:0;
    transition: opacity .15s, color .15s;
  }
  .row.mine:hover .del-btn{ opacity:1; }
  .del-btn:hover{ color: var(--danger); }

  .row.deleting .bubble{ opacity:0.35; }
  .row.leaving{
    animation: rowLeave 260ms ease forwards;
  }
  @keyframes rowLeave{
    to{ opacity:0; transform: scale(0.85) translateY(6px); }
  }

  .row.enter{
    animation: rowEnter 420ms cubic-bezier(.22,1,.36,1) both;
  }
  @keyframes rowEnter{
    from{ opacity:0; transform: translateY(16px) scale(0.94); }
    to{ opacity:1; transform:none; }
  }
  .row.landed .bubble{
    animation: bubblePop 380ms cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes bubblePop{
    0%{ transform: scale(0.7); opacity:0.4; }
    65%{ transform: scale(1.05); opacity:1; }
    100%{ transform: scale(1); }
  }

  .ghost-orb{
    position: fixed;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, #c94bff, var(--accent) 55%, #8a1fe0);
    box-shadow: 0 8px 24px -4px rgba(176,38,255,0.65), 0 0 0 1px rgba(255,255,255,0.4) inset;
    z-index: 60;
    pointer-events: none;
    top:0; left:0;
  }

  /* ---------- Composer ---------- */
  form#composer{
    display:flex;
    gap: 10px;
    padding: 18px 28px 22px;
    background: rgba(255,255,255,0.35);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border-top: 1px solid rgba(255,255,255,0.6);
  }
  form#composer textarea{
    flex:1;
    resize:none;
    background: rgba(255,255,255,0.6);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.8);
    box-shadow: inset 0 1px 2px rgba(120,60,200,0.05);
    border-radius: 12px;
    color: var(--text);
    font-family:'IBM Plex Sans', sans-serif;
    font-size: 14px;
    padding: 11px 14px;
    outline:none;
    line-height:1.4;
    max-height: 140px;
    transition: border-color .15s, box-shadow .15s, height .12s ease;
  }
  form#composer textarea:focus{
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent);
  }
  form#composer button{
    background: linear-gradient(135deg, #c94bff, var(--accent) 55%, #8a1fe0);
    color: #fff;
    border:none;
    border-radius: 10px;
    padding: 0 22px;
    font-weight:600;
    font-size: 14px;
    cursor:pointer;
    box-shadow: 0 4px 14px -4px color-mix(in srgb, var(--accent) 55%, transparent);
    transition: filter .15s, transform .1s;
  }
  form#composer button:hover{ filter: brightness(1.06); }
  form#composer button:active{ transform: scale(0.97); }
  form#composer button:disabled{
    background: var(--line);
    color: var(--muted);
    cursor:not-allowed;
  }

  @media (max-width: 720px){
    body{ height: 100dvh; }
    :root{
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    .menu-btn{
      display: flex;
    }
    aside{
      position: fixed;
      top: 0; left: 0; bottom: 0;
      width: 78vw;
      max-width: 300px;
      min-width: 0;
      z-index: 30;
      padding: calc(18px + env(safe-area-inset-top, 0px)) 18px 18px;
      transform: translateX(-100%);
      transition: transform .28s cubic-bezier(.22,1,.36,1);
      box-shadow: 8px 0 30px rgba(90,30,160,0.18);
    }
    aside.open{ transform: translateX(0); }
    .overlay{
      display: block;
      position: fixed;
      inset: 0;
      background: rgba(40,10,70,0.28);
      backdrop-filter: blur(2px);
      z-index: 25;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s ease;
    }
    .overlay.open{ opacity: 1; pointer-events: auto; }

    header{
      padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 12px;
      gap: 10px;
    }
    header h2{ font-size: 14px; flex:1; }
    #count-label{ font-size: 10px; }
    #log{ padding: 14px 14px 6px; }
    form#composer{
      padding: 12px 14px calc(14px + env(safe-area-inset-bottom, 0px));
    }
    form#composer textarea{ font-size: 16px; } /* prevents iOS auto-zoom */
    form#composer button{ padding: 0 18px; font-size: 13px; }
    .bubble-wrap{ max-width: 84%; }
    .bubble{ font-size: 13.5px; }
    .meta{ font-size: 10px; }

    /* delete has no hover on touch — keep it tappable and visible */
    .del-btn{ opacity: 0.55; font-size: 10px; padding: 4px 6px; }

    /* lighter glass + fewer moving parts to stay smooth on phones */
    aside, header, form#composer{
      backdrop-filter: blur(16px) saturate(160%);
      -webkit-backdrop-filter: blur(16px) saturate(160%);
    }
    .row.theirs .bubble, .row.mine .bubble{
      backdrop-filter: blur(8px) saturate(140%);
      -webkit-backdrop-filter: blur(8px) saturate(140%);
    }
    .bg-wash{ filter: blur(60px) saturate(160%); }
    .blob{ filter: blur(46px); }
    .blob5, .blob6{ display: none; }
  }

  @media (max-width: 380px){
    .bubble-wrap{ max-width: 90%; }
    aside{ width: 84vw; }
  }
</style>
</head>
<body>
<div class="bg-wash"></div>
<div class="blob blob1"></div>
<div class="blob blob2"></div>
<div class="blob blob3"></div>
<div class="blob blob4"></div>
<div class="blob blob5"></div>
<div class="blob blob6"></div>

<div class="overlay" id="overlay"></div>

<aside id="sidebar">
  <div class="brand"><span class="dot"></span><h1>чат · клиент</h1></div>

  <div class="field">
    <label>адрес сервера</label>
    <input id="cfg-server" type="text" value="http://127.0.0.1:9090" spellcheck="false">
  </div>
  <div class="field">
    <label>id_user</label>
    <input id="cfg-user" type="number" spellcheck="false">
  </div>

  <div class="status">
    <div class="status-row"><span class="status-led" id="led"></span><span id="status-text">не подключено</span></div>
    <button class="refresh-btn" id="refresh-btn">↻ обновить историю</button>
  </div>
</aside>

<main>
  <header>
    <button class="menu-btn" id="menu-btn" aria-label="настройки">
      <span></span><span></span><span></span>
    </button>
    <h2>История сообщений</h2>
    <span id="count-label">0 сообщений</span>
  </header>

  <div id="log">
    <div class="empty" id="empty-state">
      <div class="big">···</div>
      сообщений пока нет —<br>отправьте первое ниже
    </div>
  </div>

  <form id="composer">
    <textarea id="msg-input" rows="1" placeholder="Написать сообщение…" autocomplete="off"></textarea>
    <button type="submit" id="send-btn">Отправить</button>
  </form>
</main>

<script>
(function(){
  const $ = (sel) => document.querySelector(sel);
  const logEl = $('#log');
  const emptyState = $('#empty-state');
  const serverInput = $('#cfg-server');
  const userInput = $('#cfg-user');
  const led = $('#led');
  const statusText = $('#status-text');
  const countLabel = $('#count-label');
  const composer = $('#composer');
  const msgInput = $('#msg-input');
  const sendBtn = $('#send-btn');
  const refreshBtn = $('#refresh-btn');
  const sidebar = $('#sidebar');
  const overlay = $('#overlay');
  const menuBtn = $('#menu-btn');

  function openSidebar(){
    sidebar.classList.add('open');
    overlay.classList.add('open');
    menuBtn.classList.add('open');
  }
  function closeSidebar(){
    sidebar.classList.remove('open');
    overlay.classList.remove('open');
    menuBtn.classList.remove('open');
  }
  menuBtn.addEventListener('click', () => {
    sidebar.classList.contains('open') ? closeSidebar() : openSidebar();
  });
  overlay.addEventListener('click', closeSidebar);

  // ---- client-side generated identifiers (per the API's own rule: the client
  // generates every value it sends to the server) ----
  function randomUserId(){
    return Math.floor(1000 + Math.random() * 9000);
  }
  function nextMessageId(){
    // millisecond timestamp + small random tail keeps it unique per client
    return Date.now() * 1000 + Math.floor(Math.random() * 1000);
  }

  userInput.value = localStorage.getItem('chat_id_user') || randomUserId();
  serverInput.value = localStorage.getItem('chat_server') || serverInput.value;
  userInput.addEventListener('change', () => localStorage.setItem('chat_id_user', userInput.value));
  serverInput.addEventListener('change', () => localStorage.setItem('chat_server', serverInput.value));

  let messages = []; // {id_user, id_message, data_message, ...raw}
  let prevIds = new Set();
  let justSentIds = new Set();
  let pollTimer = null;

  function serverBase(){
    return serverInput.value.trim().replace(/\/+$/, '');
  }
  function myId(){
    return String(userInput.value).trim();
  }

  function setStatus(ok, text){
    led.classList.toggle('ok', ok === true);
    led.classList.toggle('bad', ok === false);
    statusText.textContent = text;
  }

  function formatTime(raw){
    // best-effort: server response format for history entries isn't fixed,
    // so we only show a timestamp if one is present.
    if (!raw) return '';
    const d = new Date(raw);
    if (isNaN(d.getTime())) return '';
    return d.toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'});
  }

  function render(){
    const currentIds = new Set(messages.map(m => m.id_message));
    const animateEntrances = prevIds.size > 0; // skip flood-animating the first load
    logEl.querySelectorAll('.row').forEach(el => el.remove());
    countLabel.textContent = messages.length + ' ' + pluralize(messages.length);
    emptyState.style.display = messages.length ? 'none' : 'block';

    for (const m of messages){
      const mine = String(m.id_user) === myId();
      const row = document.createElement('div');
      row.className = 'row ' + (mine ? 'mine' : 'theirs');
      row.dataset.id = m.id_message;

      if (justSentIds.has(m.id_message)){
        row.classList.add('landed');
        justSentIds.delete(m.id_message);
      } else if (animateEntrances && !prevIds.has(m.id_message)){
        row.classList.add('enter');
      }

      const wrap = document.createElement('div');
      wrap.className = 'bubble-wrap';

      const meta = document.createElement('div');
      meta.className = 'meta';
      const timeStr = formatTime(m.timestamp || m.time || m.created_at);
      meta.textContent = (mine ? 'вы' : ('user ' + m.id_user)) + (timeStr ? ' · ' + timeStr : '') + ' · #' + m.id_message;

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = m.data_message;

      wrap.appendChild(meta);
      wrap.appendChild(bubble);

      if (mine){
        const del = document.createElement('button');
        del.className = 'del-btn';
        del.textContent = 'удалить';
        del.addEventListener('click', () => deleteMessage(m.id_message, row));
        wrap.appendChild(del);
      }

      row.appendChild(wrap);
      logEl.appendChild(row);
    }
    prevIds = currentIds;
    logEl.scrollTop = logEl.scrollHeight;
  }

  function pluralize(n){
    const mod10 = n % 10, mod100 = n % 100;
    if (mod10 === 1 && mod100 !== 11) return 'сообщение';
    if ([2,3,4].includes(mod10) && ![12,13,14].includes(mod100)) return 'сообщения';
    return 'сообщений';
  }

  // ---- normalizes whatever shape /history returns into an array of messages ----
  function extractList(payload){
    if (Array.isArray(payload)) return payload;
    if (payload && Array.isArray(payload.history)) return payload.history;
    if (payload && Array.isArray(payload.messages)) return payload.messages;
    if (payload && Array.isArray(payload.data)) return payload.data;
    return [];
  }

  async function loadHistory(){
    try{
      const res = await fetch(serverBase() + '/history');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const payload = await res.json();
      const list = extractList(payload);
      const newMessages = list
        .map(raw => ({
          id_user: raw.id_user,
          id_message: raw.id_message,
          data_message: raw.data_message,
          timestamp: raw.timestamp || raw.time || raw.created_at
        }))
        .sort((a, b) => (a.id_message ?? 0) - (b.id_message ?? 0));

      // messages present now but missing from the fresh history were deleted
      // (by us or by another client) — play the same fade-out before swapping
      const newIds = new Set(newMessages.map(m => m.id_message));
      const removedIds = messages
        .map(m => m.id_message)
        .filter(id => !newIds.has(id));

      if (removedIds.length){
        removedIds.forEach(id => {
          const rowEl = logEl.querySelector('.row[data-id="' + id + '"]');
          if (rowEl) rowEl.classList.add('leaving');
        });
        await new Promise(r => setTimeout(r, 260));
      }

      messages = newMessages;
      setStatus(true, 'подключено');
      render();
    } catch(err){
      setStatus(false, 'нет соединения с сервером');
    }
  }

  // ---- flies a small glowing orb from the composer to its landing spot in
  // the chat log, then resolves so the real bubble can pop in there ----
  function flyToChat(sourceRect){
    return new Promise(resolve => {
      const orb = document.createElement('div');
      orb.className = 'ghost-orb';
      document.body.appendChild(orb);

      const startX = sourceRect.left + sourceRect.width / 2 - 20;
      const startY = sourceRect.top + sourceRect.height / 2 - 20;
      orb.style.left = startX + 'px';
      orb.style.top = startY + 'px';

      const logRect = logEl.getBoundingClientRect();
      const targetX = (logRect.right - 56) - startX;
      const targetY = (logRect.bottom - 40) - startY;
      const arcY = targetY * 0.4 - 70;

      const anim = orb.animate([
        { transform: 'translate(0px,0px) scale(1)', opacity: 1 },
        { transform: `translate(${targetX * 0.55}px, ${arcY}px) scale(0.85)`, opacity: 1, offset: 0.55 },
        { transform: `translate(${targetX}px, ${targetY}px) scale(0.3)`, opacity: 0.15 }
      ], { duration: 560, easing: 'cubic-bezier(.22,1,.36,1)', fill: 'forwards' });

      anim.onfinish = () => { orb.remove(); resolve(); };
      // fallback in case animate() is unsupported or interrupted
      setTimeout(() => { if (orb.isConnected){ orb.remove(); resolve(); } }, 700);
    });
  }

  async function sendMessage(text, sourceRect){
    const id_message = nextMessageId();
    const body = {
      id_user: Number(myId()),
      id_message: id_message,
      data_message: text
    };
    sendBtn.disabled = true;

    await flyToChat(sourceRect);

    justSentIds.add(id_message);
    messages.push(body);
    render();

    try{
      const res = await fetch(serverBase() + '/send', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(body)
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      setStatus(true, 'подключено');
      loadHistory();
    } catch(err){
      setStatus(false, 'не удалось отправить');
      messages = messages.filter(m => m.id_message !== id_message);
      render();
    } finally {
      sendBtn.disabled = false;
    }
  }

  async function deleteMessage(id_message, rowEl){
    rowEl.classList.add('deleting');
    try{
      const res = await fetch(serverBase() + '/delete', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({id_message: id_message})
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      rowEl.classList.add('leaving');
      await new Promise(r => setTimeout(r, 260));
      messages = messages.filter(m => m.id_message !== id_message);
      render();
    } catch(err){
      rowEl.classList.remove('deleting');
      setStatus(false, 'не удалось удалить');
    }
  }

  composer.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = msgInput.value.trim();
    if (!text) return;
    const rect = msgInput.getBoundingClientRect();
    msgInput.value = '';
    msgInput.style.height = 'auto';
    sendMessage(text, rect);
  });

  msgInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      composer.requestSubmit();
    }
  });
  msgInput.addEventListener('input', () => {
    msgInput.style.height = 'auto';
    msgInput.style.height = Math.min(msgInput.scrollHeight, 140) + 'px';
  });

  refreshBtn.addEventListener('click', () => { loadHistory(); closeSidebar(); });
  serverInput.addEventListener('change', loadHistory);
  userInput.addEventListener('change', render);

  loadHistory();
  pollTimer = setInterval(loadHistory, 4000);
})();
</script>
</body>
</html>
